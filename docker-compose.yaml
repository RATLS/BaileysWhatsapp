services:
  redis:
    image: redis:7-alpine
    # No host port mapping: Redis must only be reachable on the compose
    # network. Publishing 6379 exposed an unauthenticated Redis to the
    # internet (REPLICAOF hijack wiped the dataset repeatedly).
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
      --maxmemory 140mb
      --maxmemory-policy volatile-lru
      --save 60 1000
      --appendonly yes
      --appendfsync everysec
      --timeout 0
      --tcp-keepalive 60
      --maxclients 100
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: '0.5'

  worker:
    build: ./worker
    depends_on:
      redis:
        condition: service_healthy
    environment:
      WA_DEVICE_NAME: "Admissions - CRM"
      WA_DEVICE_PLATFORM: "Linux"
      WA_DEVICE_VERSION: "120.0.0"
      LOG_LEVEL: "warn"
      CLIENT_LOG_LEVEL: "info"
      LOG_CLIENTS_DIR: "/logs/clients"
      SCRUB_SIGNAL_LOGS: "true"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
    volumes:
      - ./sessions:/sessions
      - ./logs:/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  api:
    build: ./api
    depends_on:
      redis:
        condition: service_healthy
    environment:
      LOG_LEVEL: "warn"
      API_LOG_LEVEL: "warn"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
      # Frontend origin -> environment, used to label clients (wa:clients:env).
      ENV_ORIGINS: "${ENV_ORIGINS:-https://development.reachandteach.in=dev,https://testing.reachandteach.in=test,https://master.reachandteach.in=uat,https://institute.reachandteach.in=prod}"
    volumes:
      - ./logs:/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 100M

  alerter:
    build: ./alerter
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
      # Secret, set in .env. Empty = dry run (messages are only logged).
      GOOGLE_CHAT_WEBHOOK_URL: "${GOOGLE_CHAT_WEBHOOK_URL:-}"
      ALERT_INSTANCE_NAME: "${ALERT_INSTANCE_NAME:-}"
      ALERT_DASHBOARD_URL: "${ALERT_DASHBOARD_URL:-}"
      ALERT_TIMEZONE: "${ALERT_TIMEZONE:-Asia/Kolkata}"
      ALERT_DAILY_OK_TIME: "${ALERT_DAILY_OK_TIME:-10:00}"
      ALERT_DISCONNECT_GRACE_MS: "${ALERT_DISCONNECT_GRACE_MS:-180000}"
      ALERT_QR_GRACE_MS: "${ALERT_QR_GRACE_MS:-600000}"
      ALERT_QUEUE_STUCK_MS: "${ALERT_QUEUE_STUCK_MS:-600000}"
      ALERT_FAILURE_THRESHOLD: "${ALERT_FAILURE_THRESHOLD:-5}"
      LOG_LEVEL: "info"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: '0.25'

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_started
    ports:
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 100M

  dashboard:
    build: ./dashboard
    depends_on:
      api:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      DASH_USER: "admin"
      DASH_PASS: "change-me"
      DASH_PORT: "8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 100M

volumes:
  redis-data:
